<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kỷ Niệm Thanh Xuân</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Màn hình 1: Lời chào ban đầu -->
    <div id="screen1" class="screen">
        <p>Nhấn vào màn hình hoặc ấn Enter để bắt đầu</p>
    </div>

    <!-- Hiệu ứng màn kéo mở đầu -->
    <div id="curtain" class="curtain">
        <div class="curtain-panel curtain-left"></div>
        <div class="curtain-panel curtain-right"></div>
    </div>

    <!-- Đếm ngược 3, 2, 1 -->
    <div id="countdown" class="screen overlay">
        <h1 id="count-number">3</h1>
    </div>

    <!-- Màn hình Opening / Chapter Titles -->
    <div id="opening" class="screen overlay hide">
        <h2>HÀNH TRÌNH THANH XUÂN</h2>
    </div>

    <div id="chapter1" class="screen overlay hide">
        <h2>CHAPTER 1: NHỮNG KHOẢNH KHẮC ĐẦU TIÊN</h2>
    </div>

    <div id="chapter2-screen" class="screen overlay hide">
        <h2>CHAPTER 2: NỤ CƯỜI VÀ NẮNG MỚI</h2>
    </div>

    <div id="chapter3" class="screen overlay title-ch3">
        <h2>CHAPTER 3: HÀNH TRÌNH TIẾP NỐI</h2>
    </div>

    <!-- Hiệu ứng chữ gõ (Typewriter Text) -->
    <div class="typewriter-container">
        <p id="typewriter-left" class="typewriter-text"></p>
        <p id="typewriter-right" class="typewriter-text"></p>
    </div>

    <div class="typewriter-container-v3">
        <p id="typewriter-v3-left" class="typewriter-text"></p>
        <p id="typewriter-v3-right" class="typewriter-text"></p>
    </div>

    <!-- Khung xem slide ảnh -->
    <img id="imageViewer" class="media-element image-element" src="" alt="Slideshow Image">

    <!-- Danh sách Video (Đã mute 100% & playsinline) -->
    <video id="video1" class="media-element" src="videos/video1.mp4" muted playsinline></video>
    <video id="video2" class="media-element" src="videos/video2.mp4" muted playsinline></video>
    <video id="video3" class="media-element" src="videos/video3.mp4" muted playsinline></video>
    <video id="video4" class="media-element" src="videos/video4.mp4" muted playsinline></video>
    <video id="video5" class="media-element" src="videos/video5.mp4" muted playsinline></video>
    <video id="video6" class="media-element" src="videos/video6.mp4" muted playsinline></video>
    <video id="video7" class="media-element" src="videos/video7.mp4" muted playsinline></video>

    <!-- Màn hình Trích dẫn Outro -->
    <div id="outro-screen" class="screen overlay hide">
        <p id="outro-text" class="quote-text"></p>
        <p id="tbc-highlight" class="tbc-text"></p>
    </div>

    <!-- Movie Credits màn hình cuối -->
    <div id="credits-screen" class="screen overlay hide">
        <div class="credits-content">
            <h3>CẢM ƠN VÌ ĐÃ LÀ MỘT PHẦN CỦA HÀNH TRÌNH</h3>
            <p>Director: Yourself</p>
            <p>Music & Special Thanks</p>
            <p class="the-end">THE END</p>
        </div>
    </div>

    <!-- Nhạc nền & Hiệu ứng âm thanh -->
    <audio id="projectorStart" src="audio/projector_start.mp3" preload="auto"></audio>
    <audio id="projectorLoop" src="audio/projector_loop.mp3" loop preload="auto"></audio>
    <audio id="bgm" src="audio/bgm1.mp3" loop preload="auto"></audio>
    <audio id="bgm2" src="audio/bgm2.mp3" loop preload="auto"></audio>
    <audio id="bgm3" src="audio/bgm3.mp3" loop preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
