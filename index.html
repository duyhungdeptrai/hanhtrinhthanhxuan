<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kỷ Niệm Thanh Xuân</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- THẺ ÂM THANH (Audio Elements) -->
    <audio id="projectorStart" src="audio/projector_start.mp3" preload="auto"></audio>
    <audio id="projectorLoop" src="audio/projector_loop.mp3" preload="auto" loop></audio>
    <audio id="bgm" src="audio/bgm1.mp3" preload="auto" loop></audio>
    <audio id="bgm2" src="audio/bgm2.mp3" preload="auto" loop></audio>
    <audio id="bgm3" src="audio/bgm3.mp3" preload="auto" loop></audio>

    <!-- SCREEN 1: Bắt đầu -->
    <div id="screen1" class="screen">
        <p class="tap-notice">Chạm vào màn hình hoặc nhấn ENTER để bắt đầu</p>
    </div>

    <!-- MÀN RÈM -->
    <div id="curtain">
        <div class="curtain-left"></div>
        <div class="curtain-right"></div>
    </div>

    <!-- COUNTDOWN 3-2-1 -->
    <div id="countdown" class="screen">
        <span id="count-number">3</span>
    </div>

    <!-- MÀN HÌNH MỞ ĐẦU (OPENING) -->
    <div id="opening" class="overlay-text hide">
        <h1>HÀNH TRÌNH THANH XUÂN</h1>
    </div>

    <!-- CHAPTER 1 TITLE -->
    <div id="chapter1" class="overlay-text hide">
        <h2>Chương 1: Những Bước Chân Đầu Tiên</h2>
    </div>

    <!-- CHAPTER 2 TITLE -->
    <div id="chapter2-screen" class="overlay-text hide">
        <h2>Chương 2: Nụ Cười & Ký Ức</h2>
    </div>

    <!-- CHAPTER 3 TITLE -->
    <div id="chapter3" class="overlay-text">
        <h2>Chương 3: Lời Cảm Ơn</h2>
    </div>

    <!-- CÁC VIDEO -->
    <video id="video1" class="video-player" src="video/video1.mp4" playsinline></video>
    <video id="video2" class="video-player" src="video/video2.mp4" playsinline></video>
    <video id="video3" class="video-player" src="video/video3.mp4" playsinline></video>
    <video id="video4" class="video-player" src="video/video4.mp4" playsinline></video>
    <video id="video5" class="video-player" src="video/video5.mp4" playsinline></video>
    <video id="video6" class="video-player" src="video/video6.mp4" playsinline></video>
    <video id="video7" class="video-player" src="video/video7.mp4" playsinline></video>

    <!-- KHUNG HÌNH ẢNH (Image Viewer) -->
    <img id="imageViewer" class="image-viewer" src="" alt="Memory Image">

    <!-- HIỆU ỨNG CHỮ GÕ TYPEWRITER OVERLAY -->
    <div id="typewriter-container" class="typewriter-overlay">
        <p id="typewriter-left" class="typewriter-text"></p>
        <p id="typewriter-right" class="typewriter-text"></p>
        <p id="typewriter-v3-left" class="typewriter-text"></p>
        <p id="typewriter-v3-right" class="typewriter-text"></p>
    </div>

    <!-- MÀN HÌNH TRÍCH DẪN (OUTRO SCREEN) -->
    <div id="outro-screen" class="screen">
        <p id="outro-text" class="quote-text"></p>
        <p id="tbc-highlight" class="tbc-text"></p>
    </div>

    <!-- MOVIE CREDITS (KẾT THÚC) -->
    <div id="credits-screen" class="credits-container">
        <div class="credits-content">
            <h3>CẢM ƠN BẠN ĐÃ THEO DÕI</h3>
            <p>Một cuốn phim nhỏ lưu giữ thanh xuân</p>
            <br>
            <p>Director: Bạn</p>
            <p>Music: Special Soundtrack</p>
            <br>
            <p>— THE END —</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
